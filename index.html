function sortProjects(src){
const descAr={logos:'من أعمال MindSketch — تصميم شعار.',ads:'من أعمال MindSketch — تصميم إعلاني.',print:'من أعمال MindSketch — تصميم مطبوعات.'};
const descEn={logos:'From MindSketch — logo design.',ads:'From MindSketch — advertising design.',print:'From MindSketch — print design.'};
const parts=src.split('<template id="content-en">');
const done=parts.map(function(part){
const re=/<article class="ah-project" data-category="(logos|ads|print)">[\s\S]*?<\/article>/g;
const blocks=[...part.matchAll(re)].map(function(m){return m[0];});
if(blocks.length!==17)return part;
const num=function(b){const m=b.match(/class="ah-number"[^>]*>(\d+)</);return m?parseInt(m[1],10):0;};
const start=part.indexOf(blocks[0]);
const end=part.indexOf(blocks[blocks.length-1])+blocks[blocks.length-1].length;
const sorted=blocks.slice().sort(function(a,b){return num(a)-num(b);}).map(function(b){
const cat=(b.match(/data-category="(logos|ads|print)"/)||[])[1]||'ads';
const ar=/[\u0600-\u06FF]/.test(b);
const d=(ar?descAr:descEn)[cat];
return b.replace('</h3>','</h3><p class="ah-project-desc">'+d+'</p>');
});
return part.slice(0,start)+sorted.join('')+part.slice(end);
});
return done.join('<template id="content-en">');
}
